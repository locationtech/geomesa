services:
  trino:
    image: trinodb/trino:481
    container_name: trino
    ports:
      - "8080:8080"
    environment:
      # Trino catalog files reference these via ${ENV:...} substitution.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    volumes:
      - ./config/trino/config.properties:/etc/trino/config.properties
      - ./config/trino/jvm.config:/etc/trino/jvm.config
      - ./config/trino/node.properties:/etc/trino/node.properties
      - ./config/trino/catalog/spatial_iceberg-aws.properties:/etc/trino/catalog/spatial_iceberg.properties
      - ./config/trino/auth/geomesa-auth-mapping.properties:/etc/trino/auth/geomesa-auth-mapping.properties:ro
      - ./config/trino/auth/group-provider.properties:/etc/trino/group-provider.properties:ro
      - ./config/trino/auth/groups.txt:/etc/trino/group.txt:ro
      - ./dist/geomesa-trino-plugin:/usr/lib/trino/plugin/iceberg-spatial:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
