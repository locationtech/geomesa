# Plain Iceberg catalog used only to CREATE/INSERT the pruning fixture (writes) —
# the spatial_iceberg connector is a read-path wrapper and does not support writes.
# Points at the same REST catalog + S3 warehouse as spatial.properties, so a table
# written here is read back through the spatial catalog. See VisibilityPruningEndToEndIT.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest-catalog:8181
iceberg.file-format=PARQUET
fs.s3.enabled=true
s3.endpoint=http://seaweed:8333
s3.aws-access-key=admin
s3.aws-secret-key=admin
s3.path-style-access=true
s3.region=us-east-1
