# spatial_iceberg read catalog with Trino-layer visibility enforcement + the sound
# expression-domain file-pruning tier enabled. Reads the fixture written through the
# plain iceberg catalog (same REST catalog + S3 warehouse). See VisibilityPruningEndToEndIT.
connector.name=spatial_iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest-catalog:8181
iceberg.file-format=PARQUET
fs.s3.enabled=true
s3.endpoint=http://seaweed:8333
s3.aws-access-key=admin
s3.aws-secret-key=admin
s3.path-style-access=true
s3.region=us-east-1
# Trino-layer enforcement: resolve auth tokens for the querying user from a mapping file.
geomesa.security.auth-resolver=file
geomesa.security.auth-mapping-file=/etc/trino/geomesa-auths.properties
# Visibility-column file pruning (the feature under test) + its complete candidate universe.
geomesa.security.enable-visibility-expression-pruning=true
geomesa.security.visibility-expressions=admin,ops,finance
