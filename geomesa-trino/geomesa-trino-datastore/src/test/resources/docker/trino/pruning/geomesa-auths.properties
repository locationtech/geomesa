# Identity -> auth-token mapping consumed by the built-in file AuthorizationResolver
# (geomesa.security.auth-resolver=file). Read from inside the Trino container, where the
# spatial_iceberg plugin runs. 'nobody' is deliberately absent -> resolves to the empty
# auth set (fail-closed). See VisibilityPruningEndToEndIT.
user.allauths=admin,ops,finance
user.opsuser=ops
