# Demo identity -> authorization mapping for Trino-layer row-visibility
# enforcement (spatial_iceberg catalog). A request's auths are the union of its
# user.<name> entry and the group.<name> entry for every group it belongs to.
# Unknown/unmapped identity -> no auths (fail-closed: sees only unrestricted rows).

group.fouo=U,FOUO
group.public=U

# The geomesa-trino DataStore connects as a trusted intermediary and applies
# its OWN per-request row filter (from the GeoTools/WFS user's auths). Its Trino
# service account must therefore hold the FULL auth set so the Trino-layer
# filter is a no-op for it and the datastore's conjunct stays authoritative.
user.geomesa=U,FOUO
