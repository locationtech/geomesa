connector.name=spatial_iceberg
iceberg.catalog.type=glue
iceberg.file-format=PARQUET
iceberg.metadata-cache.enabled=true

# Glue connection — region + creds come from the container env.
hive.metastore.glue.region=${ENV:AWS_REGION}
hive.metastore.glue.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.metastore.glue.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
# Default S3 prefix for NEW tables you create through this catalog. Existing
# tables ignore this — Glue already stores their absolute S3 location.
hive.metastore.glue.default-warehouse-dir=${ENV:ICEBERG_WAREHOUSE}

# S3 client — same env vars as before; Trino reads/writes data files directly.
fs.native-s3.enabled=true
s3.endpoint=${ENV:AWS_S3_ENDPOINT}
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
s3.region=${ENV:AWS_REGION}
s3.path-style-access=false
s3.max-connections=500
s3.max-error-retries=10

# Trino-layer row-visibility enforcement (opt-in). Edit the mapping file for
# real identities; remove these two lines to disable Trino-layer filtering.
geomesa.security.auth-resolver=file
geomesa.security.auth-mapping-file=/etc/trino/auth/geomesa-auth-mapping.properties

