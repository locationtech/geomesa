name: dash

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * 0'

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

env:
  JAVA_VERSION: 25
  JAVA_RUNTIME_VERSION: 17
  MAVEN_CLI_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false --batch-mode -Dlicense.skip=true
  MAVEN_COMPILE_NO_OP_ARGS: clean install -Dmaven.test.skip -Dmaven.assembly.skip=true -Dmaven.source.skip -Pskip-spark-runtimes -Dmaven.main.skip -pl !geomesa-trino/geomesa-trino-plugin
  MAVEN_COMPILE_TRINO_PLUGIN_ARGS: clean install -Dmaven.test.skip -Dmaven.source.skip -pl geomesa-trino/geomesa-trino-plugin -am
  MAVEN_DASH_ARGS: org.eclipse.dash:license-tool-plugin:license-check -Ddash.fail=true -Ddash.batch=50 -Ddash.projectId=locationtech.geomesa -DexcludeGroupIds=org.locationtech.geomesa

jobs:
  license-check:
    name: license-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            ${{ env.JAVA_RUNTIME_VERSION }}
            ${{ env.JAVA_VERSION }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: main-2.13-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            main-2.13-
            main-
          path: ~/.m2/repository/
      - name: Check for dependency changes
        id: dependency_changes
        env:
          GIT_REF: ${{ github.base_ref }}
        run: |
          changed="false"
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "Checking for dependency changes"
            # get the changed files
            git fetch --depth=1 origin "${GIT_REF}"
            IFS=$'\n' read -r -d '' -a changedFiles < <( git diff --name-only "origin/${GIT_REF}" && printf '\0' )
            echo "Changed files:"
            for file in "${changedFiles[@]}"; do
              echo "  $file"
              if [[ "$file" == "build/dependencies.txt" ]]; then
                echo "Detected dependency change"
                changed="true"
              elif [[ "$changed" = "false" ]] && [[ $file =~ .*pom.xml ]]; then
                changed="pom"
              fi
            done
          else
            # weekly or dispatch requests
            echo "Always running dash check for scheduled jobs"
            changed="true"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Set Scala version
        if: steps.dependency_changes.outputs.changed != 'false'
        # check against 2.13 as 2.12 doesn't include spark
        run: ./build/scripts/change-scala-version.sh 2.13
      - name: Compile Trino plugin
        if: steps.dependency_changes.outputs.changed != 'false'
        run: |
          set -o pipefail
          mvn $MAVEN_COMPILE_TRINO_PLUGIN_ARGS $MAVEN_CLI_OPTS | tee -a build.log
      - name: Compile
        if: steps.dependency_changes.outputs.changed != 'false'
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          mvn $MAVEN_COMPILE_NO_OP_ARGS $MAVEN_CLI_OPTS | tee -a build.log
      - name: Compile (retry)
        if: steps.compile.outcome=='failure'
        run: |
          set -o pipefail
          # retry if the failure was due to transient download errors from maven central
          if grep -q -e 'Could not transfer artifact' -e 'Failed to read artifact descriptor' -e 'Could not resolve artifact' build.log; then
            RESUME_FROM="$({ grep --text 'mvn <args> -rf ' build.log || test $? = 1; } | tail -n1 | sed 's/.*-rf/-rf/')"
            mvn $MAVEN_COMPILE_NO_OP_ARGS $MAVEN_CLI_OPTS $RESUME_FROM | tee -a build.log
          else
            exit 1
          fi
      - name: Check for untracked changes
        if: steps.dependency_changes.outputs.changed == 'pom'
        run: |
          echo "Detected pom changes, double-checking dependencies.txt"
          ./build/scripts/calculate-cqs.sh
          git diff --exit-code --quiet build/dependencies.txt || {
            echo 'Detected dependency changes - please run `./build/scripts/calculate-cqs.sh` and commit the results'
            git diff build/dependencies.txt
            exit 1
          }
          echo "Dependencies are ok, skipping dash check"
      - name: License check
        if: steps.dependency_changes.outputs.changed == 'true'
        run: mvn $MAVEN_DASH_ARGS $MAVEN_CLI_OPTS
      - name: Show license
        if: success() || failure()
        run: |
          if [[ -f target/dash/summary ]]; then
            cat target/dash/summary
          else
            echo "No dependency changes detected - skipping license check"
          fi
