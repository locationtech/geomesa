name: spark

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
    tags:
      - '**'
  pull_request:

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

env:
  JAVA_VERSION: 25
  JAVA_RUNTIME_VERSION: 17
  MAVEN_CLI_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false --batch-mode -Dlicense.skip=true
  MAVEN_COMPILE_SPARK_ARGS: clean install -Dmaven.test.skip -Dmaven.assembly.skip=true -Dmaven.source.skip
  MAVEN_TEST_SPARK_ARGS: test failsafe:integration-test failsafe:verify -Dmaven.main.skip -Dtest.fork.count=2

jobs:
  integration-tests:
    name: integration-tests / ${{ matrix.projects.name }} / ${{ matrix.scala-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala-version: [ "2.12" ] # note: spark 3.x doesn't have dockers for scala 2.13
        projects:
          - name: accumulo
            list: geomesa-accumulo/geomesa-accumulo-spark
          - name: fs
            list: geomesa-fs/geomesa-fs-spark
          - name: gt
            list: geomesa-gt/geomesa-gt-spark
          # TODO we don't have any tests for hbase spark runtime
          - name: hbase
            list: geomesa-hbase/geomesa-hbase-spark
          - name: pyspark
            list: geomesa-spark/geomesa_pyspark
            args: -Ppython
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            ${{ env.JAVA_RUNTIME_VERSION }}
            ${{ env.JAVA_VERSION }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: main-${{ matrix.scala-version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            main-${{ matrix.scala-version }}-
            main-
          path: ~/.m2/repository/
      - name: Detect affected modules
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_LIST: ${{ matrix.projects.list }}
        run: |
          affected="$(build/scripts/detect-affected-modules.sh "$BASE_SHA" "$HEAD_SHA" "$PROJECT_LIST")"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.projects.name=='pyspark'
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: geomesa-spark/geomesa_pyspark/src/test/python/requirements.txt
      - name: Install python dependencies
        if: matrix.projects.name=='pyspark'
        run: pip install -r geomesa-spark/geomesa_pyspark/src/test/python/requirements.txt
      - name: Set Scala version
        if: steps.changes.outputs.affected != 'false'
        run: ./build/scripts/change-scala-version.sh ${{ matrix.scala-version }}
      - name: Compile
        id: compile
        if: steps.changes.outputs.affected != 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          mvn $MAVEN_COMPILE_SPARK_ARGS $MAVEN_CLI_OPTS -am -pl ${{ matrix.projects.list }} ${{ matrix.projects.args }} | tee -a build.log
      - name: Compile (retry)
        if: steps.changes.outputs.affected != 'false' && steps.compile.outcome=='failure'
        run: |
          set -o pipefail
          # retry if the failure was due to transient download errors from maven central
          if grep -q -e 'Could not transfer artifact' -e 'Failed to read artifact descriptor' -e 'Could not resolve artifact' build.log; then
            RESUME_FROM="$({ grep --text 'mvn <args> -rf ' build.log || test $? = 1; } | tail -n1 | sed 's/.*-rf/-rf/')"
            mvn $MAVEN_COMPILE_SPARK_ARGS $MAVEN_CLI_OPTS -am -pl ${{ matrix.projects.list }} ${{ matrix.projects.args }} $RESUME_FROM | tee -a build.log
          else
            exit 1
          fi
      - name: Run Spark tests
        if: steps.changes.outputs.affected != 'false'
        run: mvn $MAVEN_TEST_SPARK_ARGS $MAVEN_CLI_OPTS -pl ${{ matrix.projects.list }} ${{ matrix.projects.args }}
