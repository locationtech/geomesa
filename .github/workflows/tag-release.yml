name: tag-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'GeoMesa release version'
        required: true
        type: string
      next_version:
        description: 'Next development version'
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: 25
  JAVA_RUNTIME_VERSION: 17
  MAVEN_CLI_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false --batch-mode
  MAVEN_VERSION_ARGS: -DgenerateBackupPoms=false -DprocessAllModules
  RELEASE_VERSION: ${{ github.event.inputs.version }}
  DEV_VERSION: ${{ github.event.inputs.next_version }}
  RELEASE_TAG_PREFIX: geomesa-

jobs:
  tag-release:
    name: tag-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure git user
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email '7715322+elahrvivaz@users.noreply.github.com'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            ${{ env.JAVA_RUNTIME_VERSION }}
            ${{ env.JAVA_VERSION }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: main-2.12-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            main-2.12-
            main-
          path: ~/.m2/repository/
      - name: Make release
        env:
          RELEASE_TAG: ${RELEASE_TAG_PREFIX}${RELEASE_VERSION}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          mvn versions:set -DnewVersion=${RELEASE_VERSION} $MAVEN_VERSION_ARGS $MAVEN_CLI_OPTS
          mvn versions:set-scm-tag -DnewTag=${RELEASE_TAG} $MAVEN_VERSION_ARGS $MAVEN_CLI_OPTS
          # update README and regenerate
          sed -i "s|<geomesa\.release\.version>.*|<geomesa.release.version>${RELEASE_VERSION}</geomesa.release.version>|" pom.xml
          mvn clean package -pl .
          git commit -am "[release] Prepare release ${RELEASE_VERSION}"
          git tag "${RELEASE_TAG}"
          mvn versions:set -DnewVersion=${DEV_VERSION%-SNAPSHOT}-SNAPSHOT $MAVEN_VERSION_ARGS $MAVEN_CLI_OPTS
          mvn versions:set-scm-tag -DnewTag=HEAD $MAVEN_VERSION_ARGS $MAVEN_CLI_OPTS
          git commit -am "[release] Prepare next development version"
          git push origin "${RELEASE_BRANCH}"
          git push origin "${RELEASE_TAG}"
