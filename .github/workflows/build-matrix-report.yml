name: build-matrix-report

# Reports which matrix jobs a PR affects vs skips across the build workflows: a table in the job
# summary, plus a "::warning::" annotation for each workflow that skipped any job. This is purely
# informational: it gates nothing and is independent of the build workflows. Its purpose is to
# make an incorrect skip obvious to reviewers.
#
# Uses pull_request (not pull_request_target): this job only reads, so the default read-only token
# is enough, and it avoids running in the base-repo context with a write token against PR input.

on:
  pull_request:

permissions:
  contents: read

# one report per PR at a time; a newer push supersedes an in-flight run
concurrency:
  group: build-matrix-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: build matrix report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          build/scripts/build-matrix-report.sh \
            .github/workflows/build-and-test.yml \
            .github/workflows/integration-tests.yml \
            .github/workflows/assembly.yml \
            .github/workflows/spark.yml
