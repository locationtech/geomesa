version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[dependabot] "
    groups:
      actions:
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[dependabot] "
    allow:
      - dependency-name: "*:*-maven-plugin"
      - dependency-name: "org.apache.maven.plugins:*"
    groups:
      plugins:
        update-types:
          - "major"
          - "minor"
          - "patch"
