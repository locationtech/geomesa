version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[dependabot] "
    groups:
      actions:
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[dependabot] "
    groups:
      dependencies:
        exclude-patterns:
          - "*:*-maven-plugin"
          - "org.apache.maven.plugins:*"
        update-types:
          # note: major version bumps are not grouped, so end up in a PR per update
          - "minor"
          - "patch"
      plugins:
        patterns:
          - "*:*-maven-plugin"
          - "org.apache.maven.plugins:*"
        update-types:
          - "major"
          - "minor"
          - "patch"
